slug: ad-spy
name: Ad Spy

# Scaffold provenance. The Graphed CLI reads this to check plugin
# compatibility; it is stripped on deploy and never sent to the server.
scaffold:
  name: base
  version: 0.1.0

databases:
  primary:
    env: DATABASE_URL

release:
  command: npm run db:migrate
  timeout_seconds: 600
  retries: 1

services:
  # No public paths: the whole app sits behind the Graphed gateway (graphed.com login).
  web:
    command: node packages/dashboard/.next/standalone/packages/dashboard/server.js
    port: 3000
    healthcheck: /api/health

jobs:
  # Daily: pull net-new ads for every tracked brand, analyze them, map them into the persona matrix.
  daily-pull:
    command: node cli.mjs daily
    schedule:
      cron: "0 6 * * *"
      timezone: America/Denver
    timeout_seconds: 3600
    retries: 1
